name: Package SUMOLibraries

on:
  push:
    branches:
      - 'main'
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Determine package name
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=SUMOLibraries-${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=SUMOLibraries-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      # Stage everything that should end up in the zip in ./dist/<name>/.
      # Future build/download steps can add their output to this directory.
      - name: Stage content
        shell: bash
        run: |
          mkdir -p "dist/${{ steps.meta.outputs.name }}"
          # git archive packs only tracked files of HEAD (no .git) and
          # honours export-ignore entries in .gitattributes
          git archive HEAD | tar -x -C "dist/${{ steps.meta.outputs.name }}"

      - name: Build gRPC
        shell: bash
        run: |
          git clone --recurse-submodules -b v1.82.0 --depth 1 --shallow-submodules https://github.com/grpc/grpc
          cmake -Bcmake_build -DgRPC_INSTALL=ON -DgRPC_BUILD_TESTS=OFF -DCMAKE_CXX_STANDARD=17 -DCMAKE_INSTALL_PREFIX=dist/${{ steps.meta.outputs.name }}/grpc-1.82.0 grpc
          cmake --build cmake_build --config Release --target install -j 4
          cp grpc/LICENSE dist/${{ steps.meta.outputs.name }}/grpc-1.82.0

      # - name: Build / download additional content
      #   run: ...

      - name: Create zip
        working-directory: dist
        shell: bash
        run: zip -r -q "../${{ steps.meta.outputs.name }}.zip" "${{ steps.meta.outputs.name }}"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.meta.outputs.name }}.zip
          archive: false

  release:
    # only publish for version tags
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          skip-decompress: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/*.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
 
